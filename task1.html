<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = prompt("Enter your balance:");
        var b = prompt("Enter your withdrawal amount:");
        if (a >= b) {
            alert("Transaction successful! Your remaining balance is: " + (a - b));
        } else {
            alert("Insufficient balance. Transaction failed.");
        }
    </script>
</body>
</html>
