<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
   <script>
    var a = +prompt("enter your first number")
    var b = +prompt("enter your second number")
    var c = prompt("enter your arithmetic operation (+, -, *, /)")
   
    if(c=="+"){
        var d = a+b;
        alert("the sum of two numbers is:" + d)
    }
    if(c=="-"){
        var d = a-b;
        alert("the Difference of two numbers is:" + d)
    }
     if(c=="*"){
        var d = a*b;
        alert("the product of two numbers is:" + d)
    }
    if(c=="/"){
        var d = a/b;
        alert("the quotient of two numbers is:" + d)
    }
    else{
        alert("invalid operation")
    }
   </script>
</body>
</html>
